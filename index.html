html{font-size:16px}
@media (min-width:900px){html{font-size:20px}}
@media (min-width:1400px){html{font-size:24px}}
@media (min-width:2200px){html{font-size:30px}}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--text); font-family:'Nunito',system-ui,sans-serif;
  background:radial-gradient(120% 60% at 50% 0%,var(--glow) 0%,var(--mid) 40%,var(--bg) 100%) fixed;
}
.wrap{max-width:35rem;margin:0 auto;padding:1rem 1rem 3rem}
h1,h2,h3,.oswald{font-family:'Oswald',Impact,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
img.spr{image-rendering:pixelated;object-fit:contain}

/* cabecera */
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:0.625rem;margin-bottom:0.875rem}
.brand{display:flex;align-items:center;gap:0.625rem}
.brand .trainer{width:3rem;height:3rem;border-radius:0.75rem;background:var(--card);border:1px solid var(--line);padding:0.125rem}
.brand h1{font-size:2.125rem;color:var(--accent2);letter-spacing:.5px}
.actions{display:flex;gap:0.375rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn-top{display:inline-flex;align-items:center;gap:0.375rem;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:0.625rem;padding:0.5rem 0.75rem;font-weight:800;font-size:0.875rem;text-decoration:none}
.btn-top:hover,.btn-top[aria-expanded="true"]{border-color:var(--accent)}
.btn-top[hidden]{display:none}
.theme-panel{position:absolute;right:0;top:calc(100% + 0.375rem);z-index:20;width:min(21.25rem,100%);background:var(--card2);border:1px solid var(--line);border-radius:0.875rem;padding:0.625rem;display:grid;grid-template-columns:1fr 1fr;gap:0.375rem;box-shadow:0 0.75rem 1.875rem rgba(0,0,0,.35)}
.theme-panel[hidden]{display:none}
.theme-opt{display:flex;align-items:center;gap:0.5rem;background:var(--card);border:1px solid var(--line);border-radius:0.625rem;padding:0.5rem 0.625rem;font-weight:800;font-size:0.875rem;text-align:left}
.theme-opt:hover{border-color:var(--accent)}
.theme-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--hover)}
.theme-opt .sw{flex:none;width:1.375rem;height:1.375rem;border-radius:50%;border:1px solid rgba(128,128,128,.5)}

/* equipo */
.team{background:var(--card2);border:1px solid var(--line);border-radius:1rem;padding:0.875rem;margin-bottom:0.875rem}
.team-head{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem}
.team-head img{width:2.5rem;height:2.5rem}
.team-head small{display:block;color:var(--accent);font-family:'Oswald';font-size:0.8125rem;letter-spacing:.8px;text-transform:uppercase}
.team-head b{font-family:'Oswald';font-size:1.375rem}
.team-icons{display:flex;justify-content:space-between}
.team-icons span{width:2.875rem;height:2.875rem;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.team-icons img{width:2.125rem;height:2.125rem}
.banner{background:linear-gradient(90deg,var(--banner-a),var(--banner-b));border-radius:0.75rem;padding:0.875rem 1rem;font-family:'Oswald';font-size:1.125rem;color:var(--banner-text);margin-bottom:1.125rem}

/* inicio */
.q-title{font-family:'Oswald';font-size:1.25rem;margin:0.375rem 0 0.75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6rem,1fr));gap:0.5rem}
.mon{background:var(--card);border:1px solid var(--line);border-radius:0.75rem;padding:0.625rem 0.25rem 0.5rem;display:flex;flex-direction:column;align-items:center;gap:0.25rem;font-weight:700;font-size:0.8125rem}
.mon img{width:4rem;height:4rem}
.mon:hover,.opt:hover{border-color:var(--accent);background:var(--hover)}

/* pantalla de guía */
.crumb{color:var(--muted);font-size:0.8125rem;margin:0.5rem 0 0.25rem;word-break:break-word}
.screen-title{font-size:1.875rem;color:var(--accent2);margin:0.125rem 0 0.875rem;line-height:1.15}
.note{display:flex;gap:0.625rem;background:var(--info-bg);border:1px solid var(--info-line);border-radius:0.75rem;padding:0.75rem 0.875rem;margin-bottom:0.875rem}
.note i{font-style:normal;color:var(--info);font-weight:800}
.note small,.step small{display:block;font-family:'Oswald';font-size:0.6875rem;letter-spacing:.8px;text-transform:uppercase}
.note small{color:var(--info)}
.step small{color:var(--accent)}
.step{display:flex;gap:0.75rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:0.75rem;padding:0.75rem 0.875rem;margin-bottom:0.625rem}
.step .n{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center}
.ask{text-align:center;font-family:'Oswald';text-transform:uppercase;font-size:1.062rem;margin:1.125rem 0 0.625rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.opt{display:flex;align-items:center;gap:0.625rem;background:var(--card);border:1px solid var(--line);border-radius:0.75rem;padding:0.75rem;font-weight:800;text-align:left;min-height:3.25rem}
.opt img{width:2.25rem;height:2.25rem;flex:none}
.cont{width:100%;margin-top:0.375rem;padding:0.875rem;border:0;border-radius:0.75rem;background:linear-gradient(180deg,var(--grad-a),var(--grad-b));color:var(--on-accent);font-weight:800;font-size:1rem}
.cont:hover{filter:brightness(1.08)}
.back{margin-top:0.875rem;background:none;border:0;color:var(--muted);font-weight:700;padding:0.375rem 0}
.back:hover{color:var(--text)}

/* finalizar */
.finish{background:var(--fin-bg);border:1px solid var(--fin-line);border-radius:0.875rem;overflow:hidden;margin:0.375rem 0 0.875rem}
.finish h3{font-size:0.875rem;color:var(--danger);text-transform:uppercase;letter-spacing:.6px;padding:0.75rem 0.875rem;background:var(--fin-head)}
.mv{display:flex;flex-wrap:wrap;gap:0.5rem 0.625rem;align-items:center;padding:0.75rem 0.875rem;border-top:1px solid var(--fin-line)}
.chip{font-family:ui-monospace,Consolas,monospace;font-size:0.8125rem;color:var(--chip-text);background:var(--chip-bg);border:1px solid var(--chip-line);border-radius:0.375rem;padding:0.1875rem 0.5625rem}
.mv .arrow{color:var(--muted)}
.mv .list{display:flex;flex-wrap:wrap;gap:0.125rem 0.5rem;align-items:center}
.mv .list span{display:inline-flex;align-items:center;font-size:0.875rem}
.mv .list img{width:1.875rem;height:1.875rem;margin-right:0.125rem}
.end{background:var(--end-bg);border:1px solid var(--end-line);border-radius:0.875rem;padding:1rem}
.end h3{display:flex;align-items:center;gap:0.625rem;font-size:1.25rem;margin-bottom:0.75rem}
.end h3 i{font-style:normal;width:1.875rem;height:1.875rem;border-radius:50%;background:var(--accent2);color:var(--on-accent);display:grid;place-items:center;font-size:1rem}
.btn-exit{background:var(--card);border:1px solid var(--line);border-radius:0.625rem;padding:0.625rem 1rem;font-weight:800}
.btn-exit:hover{border-color:var(--accent)}
@media (max-width:380px){.opts{grid-template-columns:1fr}.theme-panel{grid-template-columns:1fr}}
</style>
</head>
<body>

    <div class="brand">

<script>
/* ============ Sprites (Pokémon Showdown) ============ */
const SPRITE = id => `https://play.pokemonshowdown.com/sprites/gen5/${id}.png`;
const sid = name => name.toLowerCase().replace(/[^a-z0-9]/g, '');
const spr = (name, cls = '') =>
  `<img class="spr ${cls}" loading="lazy" alt="${name}" src="${SPRITE(sid(name))}" onerror="this.style.visibility='hidden'">`;

/* ============ Datos de la guía (equipo COLORED) ============ */
const TEAM = ['Blissey', 'Honchkrow', 'Golduck', 'Breloom', 'Gliscor', 'Lapras'];

const LEADS = ['Blastoise', 'Charizard', 'Emboar', 'Espeon', 'Excadrill', 'Gliscor', 'Hydreigon',
  'Pikachu', 'Samurott', 'Serperior', 'Snorlax', 'Staraptor', 'Swampert', 'Venusaur'];

/* Nodo: title, note, steps[], ask{text, options[{label, mon, to}]}, next (Continuar), finish{title, moves[{move, mons[]}]} */
const N = {
  /* ---- Rutas de inicio ---- */

      { label: 'Sin sol', to: 'venuFirstNo' }, { label: 'Con sol', to: 'venuFirstSun' }] }

  venuFirstNo: { title: 'Venusaur (sin sol)', steps: ['Usa Pajaro Osado'], next: 'honch2' },
  venuFirstSun: { title: 'Venusaur (con sol)', steps: ['Golpe bajo 2 Veces'], next: 'honch2' },

  Excadrill: { title: 'Excadrill', steps: ['Entra Con Honchkrow, Golpe Bajo', 'Entra con Breloom + Ultra Puño'], note: 'Sigue la ruta de Emboar.', next: 'roar' },

  Snorlax: {

    steps: ['Blissey, Teletransporte', 'Entra Con Breloom y usa Demolición'],

  },

  },

    title: 'Pikachu (Gen 1)', note: 'Reacciona al siguiente Pokémon de Red:',

      { label: 'Espeon', mon: 'Espeon', to: 'pikaEsp' }, { label: 'Snorlax', mon: 'Snorlax', to: 'pikaSnor' }] }
  },
  pikaEsp: { title: 'Pikachu → Espeon', steps: ['Entra con Honchkrow, Golpe Bajo '], next: 'honch2' },

  },

  /* ---- Nodos compartidos: Honchkrow +1 / +2 ---- */
  honch2: {

      { label: 'Blastoise', mon: 'Blastoise', to: 'hBlast' }, { label: 'Charizard', mon: 'Charizard', to: 'hChar' },
      { label: 'Venusaur', mon: 'Venusaur', to: 'hVenu' }, { label: 'Otro', to: 'honchEnd' }] }

/* Emboar entra directo a la pregunta del Roar */
N.Emboar = { alias: 'roar' };
const resolve = id => { let n = N[id]; while (n && n.alias) n = N[n.alias]; return n; };

/* ============ Estado y render ============ */
const app = document.getElementById('app');
const btnHome = document.getElementById('btnHome');
let path = [];           // ids visitados (pila)
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function home() {
  path = []; btnHome.hidden = true;
  app.innerHTML = `
    <section class="team">
      <div class="team-head">${spr(TEAM[0])}<div><small>Equipo actual</small><b>COLORED</b></div></div>
      <div class="team-icons">${TEAM.map(m => `<span title="${m}">${spr(m)}</span>`).join('')}</div>
    </section>
    <div class="banner">⚑ ¡Lidera siempre con Blissey!</div>
    <h2 class="q-title">¿Con qué lideró Red?</h2>
    <div class="grid" id="grid">${LEADS.map(n => `<button class="mon" data-lead="${n}">${spr(n)}<span>${n}</span></button>`).join('')}</div>`;
  document.getElementById('grid').addEventListener('click', e => { const b = e.target.closest('[data-lead]'); if (b) go(b.dataset.lead, true); });
}

function crumbText() {
  const titles = path.slice(0, -1).map(id => resolve(id).title);
  if (!titles.length) return '';
  return (titles.length > 3 ? ['…', ...titles.slice(-3)] : titles).map(esc).join(' › ');
}

function go(id, reset) {
  if (reset) path = [];
  path.push(id); render();
}

function render() {
  const id = path[path.length - 1], n = resolve(id);
  btnHome.hidden = false;
  let h = '';
  const c = crumbText();
  if (c) h += `<div class="crumb">${c}</div>`;
  h += `<h2 class="screen-title">${esc(n.title)}</h2>`;
  if (n.note) h += `<div class="note"><i>ⓘ</i><div><small>Nota</small>${esc(n.note)}</div></div>`;
  (n.steps || []).forEach((s, i) =>
    h += `<div class="step"><span class="n">${i + 1}</span><div><small>Paso</small>${esc(s)}</div></div>`);
  if (n.ask) {
    h += `<div class="ask">${esc(n.ask.text)}</div><div class="opts">` +
      n.ask.options.map(o => `<button class="opt" data-to="${o.to}">${o.mon ? spr(o.mon) : ''}<span>${esc(o.label)}</span></button>`).join('') + '</div>';
  }
  if (n.finish) {
    h += `<div class="finish"><h3>⚑ ${esc(n.finish.title)}</h3>` + n.finish.moves.map(m =>
      `<div class="mv"><span class="chip">${esc(m.move)}</span><span class="arrow">→</span>` +
      (m.mons ? `<span class="list">${m.mons.map(x => `<span>${spr(x)}${x}</span>`).join('')}</span>` : `<span>${esc(m.text)}</span>`) +
      '</div>').join('') + '</div>' +
      `<div class="end"><h3><i>✓</i>FIN DE LA GUÍA</h3><button class="btn-exit" id="exit">Salir de la guía</button></div>`;
  }
  if (n.next) h += `<button class="cont" data-to="${n.next}">Continuar</button>`;
  h += `<button class="back" id="back">← Volver</button>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);

  app.querySelectorAll('[data-to]').forEach(b => b.addEventListener('click', () => go(b.dataset.to)));
  document.getElementById('back').addEventListener('click', () => { path.length > 1 ? (path.pop(), render()) : home(); });
  const ex = document.getElementById('exit'); if (ex) ex.addEventListener('click', () => home());
}


/* ============ Temas ============ */
const THEMES = [
  { id: 'fuego', name: 'Fuego', sw: ['#ff7a1a', '#150b08'] },
  { id: 'oceano', name: 'Océano', sw: ['#22b8e8', '#06121c'] },
  { id: 'bosque', name: 'Bosque', sw: ['#4ade80', '#08130b'] },
  { id: 'noche', name: 'Noche', sw: ['#a78bfa', '#0d0a18'] },
  { id: 'electrico', name: 'Eléctrico', sw: ['#facc15', '#0c0c08'] },
  { id: 'rosa', name: 'Rosa', sw: ['#ff7eb6', '#1a0d14'] },
  { id: 'grafito', name: 'Grafito', sw: ['#2dd4bf', '#0e0f11'] },
  { id: 'claro', name: 'Claro', sw: ['#e8590c', '#fdf6ef'] }
];
const themePanel = document.getElementById('themePanel');
const btnTheme = document.getElementById('btnTheme');
function setTheme(id, save) {
  if (!THEMES.some(t => t.id === id)) id = 'fuego';
  document.documentElement.setAttribute('data-theme', id);
  if (save) { try { localStorage.setItem('guiaRedTheme', id); } catch (e) {} }
  themePanel.querySelectorAll('.theme-opt').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === id)));
}
themePanel.innerHTML = THEMES.map(t =>
  `<button class="theme-opt" type="button" data-theme="${t.id}" aria-pressed="false"><span class="sw" style="background:linear-gradient(135deg,${t.sw[0]} 50%,${t.sw[1]} 50%)"></span>${t.name}</button>`).join('');
themePanel.addEventListener('click', e => { const b = e.target.closest('[data-theme]'); if (b) setTheme(b.dataset.theme, true); });
const togglePanel = open => { themePanel.hidden = !open; btnTheme.setAttribute('aria-expanded', String(open)); };
btnTheme.addEventListener('click', e => { e.stopPropagation(); togglePanel(themePanel.hidden); });
document.addEventListener('click', e => { if (!themePanel.hidden && !themePanel.contains(e.target)) togglePanel(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') togglePanel(false); });
let saved = null; try { saved = localStorage.getItem('guiaRedTheme'); } catch (e) {}
setTheme(saved || 'fuego', false);

btnHome.addEventListener('click', () => home());
document.getElementById('trainer').addEventListener('error', e => e.target.style.visibility = 'hidden');
home();
</script>
</body>
